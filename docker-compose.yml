
services:
  postgres:
    image: postgres:17
    container_name: societyos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: societyos
      POSTGRES_USER: societyos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - societyos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U societyos -d societyos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  societyos_pgdata:
